# This file builds the three apps (vote, result, worker) from source.

services:
  vote:
    build: ./vote
    depends_on:
      redis:
        condition: service_healthy 
    ports:
      - "8080:80"
    environment:
      VOTING_MODE: ${VOTING_MODE:-every-click}
    networks:
      - back-tier

  result:
    build: ./result
    depends_on:
      db:
        condition: service_healthy 
    environment:
      PG_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in a .env file next to docker-compose.yml}
    ports:
      - "8081:80"
    networks:
      - back-tier

  worker:
    build: ./worker
    depends_on:
      redis:
        condition: service_healthy 
      db:
        condition: service_healthy 
    environment:
      VOTING_MODE: ${VOTING_MODE:-every-click}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in a .env file next to docker-compose.yml}
    networks:
      - back-tier

  redis:
    image: redis:alpine
    volumes:
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/redis.sh
      interval: "5s"
    networks:
      - back-tier

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in a .env file next to docker-compose.yml}
    volumes:
      # Postgres 18 and later keep data in a versioned subfolder of /var/lib/postgresql
      - "db-data:/var/lib/postgresql"
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/postgres.sh
      interval: "5s"
    networks:
      - back-tier

volumes:
  db-data:

networks:
  back-tier:
