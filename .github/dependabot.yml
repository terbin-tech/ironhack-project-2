version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directories:
      - /vote
      - /tests/vote
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /result
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /worker
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /vote
      - /result
      - /worker
    schedule:
      interval: weekly
