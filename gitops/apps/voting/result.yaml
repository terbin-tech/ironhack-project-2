apiVersion: v1
kind: ServiceAccount
metadata:
  name: result
  namespace: voting
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  namespace: voting
  labels:
    app.kubernetes.io/name: result
    app.kubernetes.io/part-of: voting
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: result
  template:
    metadata:
      labels:
        app.kubernetes.io/name: result
        app.kubernetes.io/part-of: voting
    spec:
      serviceAccountName: result
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # One replica per zone; minDomains keeps a pod pending until Auto Mode adds a node in the empty zone.
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: result
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: result
          image: result
          ports:
            - containerPort: 80
          env:
            - name: PG_HOST
              valueFrom:
                configMapKeyRef:
                  name: voting-config
                  key: DB_HOST
            - name: PG_PORT
              valueFrom:
                configMapKeyRef:
                  name: voting-config
                  key: DB_PORT
            - name: PG_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: voting-config
                  key: DB_NAME
            - name: PG_USER_FILE
              value: /mnt/secrets-store/username
            - name: PG_PASSWORD_FILE
              value: /mnt/secrets-store/password
            - name: PG_SSL_CA
              value: /usr/local/share/rds-global-bundle.pem
          readinessProbe:
            httpGet:
              path: /result/
              port: 80
          livenessProbe:
            httpGet:
              path: /result/
              port: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: db-credentials
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: db-credentials
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: voting-db
---
apiVersion: v1
kind: Service
metadata:
  name: result
  namespace: voting
  labels:
    app.kubernetes.io/name: result
    app.kubernetes.io/part-of: voting
spec:
  selector:
    app.kubernetes.io/name: result
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: result
  namespace: voting
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: result
