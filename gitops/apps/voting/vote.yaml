apiVersion: v1
kind: ServiceAccount
metadata:
  name: vote
  namespace: voting
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  namespace: voting
  labels:
    app.kubernetes.io/name: vote
    app.kubernetes.io/part-of: voting
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vote
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vote
        app.kubernetes.io/part-of: voting
    spec:
      serviceAccountName: vote
      # None of the apps calls the Kubernetes API, so no API token is mounted.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # One replica per zone; minDomains keeps a pod pending until Auto Mode adds a node in the empty zone.
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: vote
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: vote
          image: vote
          ports:
            - containerPort: 80
          env:
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: voting-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: voting-config
                  key: REDIS_PORT
            - name: REDIS_TLS
              value: "true"
          readinessProbe:
            httpGet:
              path: /
              port: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/app
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vote
  namespace: voting
  labels:
    app.kubernetes.io/name: vote
    app.kubernetes.io/part-of: voting
spec:
  selector:
    app.kubernetes.io/name: vote
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vote
  namespace: voting
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vote
