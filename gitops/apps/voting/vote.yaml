apiVersion: v1
kind: ServiceAccount
metadata:
  name: vote
  namespace: voting
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  namespace: voting
  labels:
    app.kubernetes.io/name: vote
    app.kubernetes.io/part-of: voting
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vote
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vote
        app.kubernetes.io/part-of: voting
    spec:
      serviceAccountName: vote
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vote
          image: vote
          ports:
            - containerPort: 80
          env:
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: voting-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: voting-config
                  key: REDIS_PORT
            - name: REDIS_TLS
              value: "true"
          readinessProbe:
            httpGet:
              path: /
              port: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: vote
  namespace: voting
  labels:
    app.kubernetes.io/name: vote
    app.kubernetes.io/part-of: voting
spec:
  selector:
    app.kubernetes.io/name: vote
  ports:
    - port: 80
      targetPort: 80
