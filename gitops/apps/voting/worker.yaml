apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: voting
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: voting
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: voting
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: voting
    spec:
      serviceAccountName: worker
      # None of the apps calls the Kubernetes API, so no API token is mounted.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # One replica per zone; minDomains keeps a pod pending until Auto Mode adds a node in the empty zone.
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: worker
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: worker
          image: worker
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: voting-config
                  key: DB_HOST
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: voting-config
                  key: DB_NAME
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: voting-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: voting-config
                  key: REDIS_PORT
            - name: DB_USERNAME_FILE
              value: /mnt/secrets-store/username
            - name: DB_PASSWORD_FILE
              value: /mnt/secrets-store/password
            - name: REDIS_TLS
              value: "true"
            - name: DB_SSL_ROOT_CERT
              value: /usr/local/share/rds-global-bundle.pem
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - find /tmp/heartbeat -newermt '-30 seconds' | grep -q .
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - find /tmp/heartbeat -newermt '-30 seconds' | grep -q .
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: db-credentials
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: db-credentials
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: voting-db
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
  namespace: voting
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
