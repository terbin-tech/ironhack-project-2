apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vote
  namespace: voting
  # ExternalDNS reads only routes with this label
  labels:
    app.kubernetes.io/part-of: voting
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - martin.diogo.world
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: vote
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: result
  namespace: voting
  # ExternalDNS reads only routes with this label
  labels:
    app.kubernetes.io/part-of: voting
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - martin.diogo.world
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /result
      backendRefs:
        - name: result
          port: 80
