apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  gatewayClassName: nginx
  infrastructure:
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
      # Cross-zone lets each zone's NLB address reach the NGINX pods in both zones, so losing one NGINX pod leaves both addresses working.
      service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: martin.diogo.world
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - voting
                  - gateway
    - name: https
      port: 443
      protocol: HTTPS
      hostname: martin.diogo.world
      tls:
        mode: Terminate
        certificateRefs:
          - name: martin-diogo-world-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - voting
                  - gateway
