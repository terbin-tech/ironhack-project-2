# ExternalDNS writes an event on a route whose record it cannot create
# (--events-emit=RecordError), in that route's namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-dns-events
  namespace: voting
rules:
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-dns-events
  namespace: voting
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-dns-events
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: external-dns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-dns-events
  namespace: gateway
rules:
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-dns-events
  namespace: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-dns-events
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: external-dns
