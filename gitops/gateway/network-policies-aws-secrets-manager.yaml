apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: aws-secrets-manager
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: aws-secrets-manager
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.100.0.10/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: csi-driver-egress
  namespace: aws-secrets-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: secrets-store-csi-driver
  policyTypes:
    - Egress
  egress:
    # Kubernetes API.
    - ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: provider-egress
  namespace: aws-secrets-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aws-secrets-store-csi-driver-provider
  policyTypes:
    - Egress
  egress:
    # Kubernetes API and Secrets Manager.
    - ports:
        - protocol: TCP
          port: 443
    # EKS Pod Identity agent, for each app's AWS credentials.
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
      ports:
        - protocol: TCP
          port: 80
