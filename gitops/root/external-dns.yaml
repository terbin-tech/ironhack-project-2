apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: project-2
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    targetRevision: 1.23.0
    helm:
      valuesObject:
        provider:
          name: aws
        sources:
          - gateway-httproute
        policy: sync
        registry: txt
        txtOwnerId: martin-project-2
        domainFilters:
          - martin.diogo.world
        # Only the site's routes, labelled in gitops/apps/voting and gitops/gateway
        labelFilter: app.kubernetes.io/part-of=voting
        # Reconcile on route changes too, not only every interval
        triggerLoopOnEvent: true
        extraArgs:
          - --aws-zone-match-parent
          - --zone-id-filter=Z06626683QXS56B0ODY18
          # An event on the route when its record cannot be created
          - --events-emit=RecordError
          # The hosted zone list changes rarely; fetch it once an hour
          - --aws-zones-cache-duration=1h
        serviceAccount:
          name: external-dns
        env:
          - name: AWS_DEFAULT_REGION
            value: us-east-1
  destination:
    name: in-cluster
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    # Argo CD creates this namespace, so it also sets its Pod Security labels.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: latest
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
